<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task Tracker Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2040%2040'%3E%3Crect%20width%3D'40'%20height%3D'40'%20rx%3D'11'%20fill%3D'%2312141c'%2F%3E%3Ccircle%20cx%3D'20'%20cy%3D'20'%20r%3D'12'%20fill%3D'none'%20stroke%3D'%233a3f4d'%20stroke-width%3D'3.6'%2F%3E%3Ccircle%20cx%3D'20'%20cy%3D'20'%20r%3D'12'%20fill%3D'none'%20stroke%3D'%239085e9'%20stroke-width%3D'3.6'%20stroke-linecap%3D'round'%20stroke-dasharray%3D'55%2020.4'%20transform%3D'rotate(-90%2020%2020)'%2F%3E%3Cpath%20d%3D'M14.8%2020.6l3.8%203.8%206.8-8'%20fill%3D'none'%20stroke%3D'%23f2f4f7'%20stroke-width%3D'3'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<script>
  // Applied before first paint so a saved light theme doesn't flash dark
  // (or vice versa) while app.js is still loading. No stored preference
  // means no attribute at all, which leaves the CSS following the OS.
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div class="bg-scene" aria-hidden="true">
    <span class="bg-blob b1"></span>
    <span class="bg-blob b2"></span>
    <span class="bg-blob b3"></span>
    <span class="bg-blob b4"></span>
  </div>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-overlay-inner">
      <span class="loading-spinner loading-spinner-lg" aria-hidden="true"></span>
      <p>Loading dashboard…</p>
    </div>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Bar fills use the quieter --fill-* set, not the --status-* marks:
           see the note beside those tokens in styles.css. -->
      <linearGradient id="gradNoStatus" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--fill-no-status);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--fill-no-status);stop-opacity:0.82" />
      </linearGradient>
      <linearGradient id="gradOverdue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--fill-overdue);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--fill-overdue);stop-opacity:0.82" />
      </linearGradient>
      <linearGradient id="gradPending" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--fill-pending);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--fill-pending);stop-opacity:0.82" />
      </linearGradient>
      <linearGradient id="gradAwaitingApproval" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--fill-awaiting-approval);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--fill-awaiting-approval);stop-opacity:0.82" />
      </linearGradient>
      <linearGradient id="gradInProgress" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--fill-in-progress);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--fill-in-progress);stop-opacity:0.82" />
      </linearGradient>
      <linearGradient id="gradCompleted" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--fill-completed);stop-opacity:1" />
        <stop offset="100%" style="stop-color:var(--fill-completed);stop-opacity:0.82" />
      </linearGradient>
    </defs>
  </svg>
  <div class="viz-root" id="app">
    <header class="page-header">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="12" fill="none" stroke-width="3.6" style="stroke:var(--text-primary)" opacity="0.14"/>
          <circle cx="20" cy="20" r="12" fill="none" stroke-width="3.6" stroke-linecap="round" style="stroke:var(--accent-violet)" stroke-dasharray="55 20.4" transform="rotate(-90 20 20)"/>
          <path d="M14.8 20.6l3.8 3.8 6.8-8" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--text-primary)"/>
        </svg>
      </div>
        <div class="brand-text">
          <h1>Task Tracker Dashboard</h1>
          <p class="header-date" id="headerDate"></p>
        </div>
      </div>
      <div class="header-actions">
        <button class="live-toggle active" id="liveToggle" type="button" title="Auto-refreshes every 10 min — click to pause">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="liveLabel">Live</span>
        </button>
        <span class="updated-at" id="updatedAt"></span>
        <button class="btn btn-icon-only theme-toggle" id="themeToggle" type="button" aria-label="Switch theme" title="Switch to light theme">
          <svg class="btn-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="btn-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        </button>
        <button class="btn btn-icon-only" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
          <svg class="btn-icon" id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span id="refreshLabel" class="sr-only">Refresh</span>
        </button>
      </div>
    </header>

    <div class="control-row">
      <nav class="tab-bar" id="tabBar" aria-label="Team selector">
        <div class="tab-indicator" id="tabIndicator"></div>
        <!-- tab buttons injected by app.js -->
      </nav>

      <div class="date-range-row">
        <label class="date-range-label" for="dateRangeSelect">Period</label>
        <select class="select-input" id="dateRangeSelect" aria-label="Date range filter">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="week" selected>This week</option>
          <option value="month">This month</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </div>
    </div>

    <nav class="section-nav" id="sectionNav" aria-label="Jump to section">
      <a href="#tasksPanel" data-target="tasksPanel" data-label="Tasks" aria-label="Tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>
      </a>
      <a href="#reportPanel" data-target="reportPanel" data-label="AI Report" aria-label="AI Report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      </a>
      <a href="#reminderPanel" data-target="reminderPanel" data-label="Reminders" aria-label="Reminders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </a>
      <a href="#teamPanel" data-target="teamPanel" data-label="By team" aria-label="By team">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.8a3.2 3.2 0 0 1 0 6.4M18 14.4c1.8.8 3 2.6 3 5.6"/></svg>
      </a>
      <a href="#chartPanel" data-target="chartPanel" data-label="Chart" aria-label="Chart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M6.5 20v-7M12 20V5M17.5 20v-10"/></svg>
      </a>
    </nav>

    <div class="period-notice" id="periodNotice" role="status" hidden></div>

    <div class="overview">
      <section class="hero-card" id="heroCard" aria-label="Overall progress">
        <!-- ring + completion rate injected by app.js -->
      </section>
      <section class="stat-row" id="statRow" aria-label="Current totals">
        <!-- stat tiles injected by app.js -->
      </section>
    </div>
    <div id="tileTooltip" class="tooltip tile-tooltip" hidden></div>

    <section class="panel" id="tasksPanel">
      <div class="panel-header">
        <h2 id="tasksTitle">Tasks</h2>
        <div class="panel-actions tasks-filters">
          <input class="text-input" id="taskSearch" type="search" placeholder="Search tasks…" aria-label="Search tasks" />
          <select class="select-input" id="taskOwnerSelect" aria-label="Filter by owner">
            <option value="">All owners</option>
          </select>
          <select class="select-input" id="taskStatusSelect" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="no_status">No Status</option>
            <option value="overdue">Overdue</option>
            <option value="pending">Pending</option>
            <option value="awaiting_approval">Awaiting Approval</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>
      <div id="subTabRow" class="sub-tab-row" hidden></div>
      <div id="ownerFilterChips" class="owner-filter-chips" hidden></div>
      <div id="taskListWrap"></div>
      <p class="task-list-count" id="taskListCount"></p>
    </section>

    <div class="bento-row">
    <section class="panel" id="reportPanel">
      <div class="panel-header">
        <h2 id="reportTitle">AI Report</h2>
        <div class="panel-actions">
          <div class="seg-toggle" id="reportModeToggle" aria-label="Report type">
            <button type="button" class="seg-btn active" data-mode="summary">Summary</button>
            <button type="button" class="seg-btn" data-mode="plan">Weekly Plan</button>
            <button type="button" class="seg-btn" data-mode="eow">End of Week</button>
            <button type="button" class="seg-btn" data-mode="eod">End of Day</button>
          </div>
          <select class="select-input" id="reportWeekSelect" aria-label="Week to report on"></select>
          <select class="select-input" id="reportDaySelect" aria-label="Day to recap" hidden></select>
          <button class="btn btn-icon-only" id="reportCopyBtn" type="button" aria-label="Copy report" title="Copy report to clipboard" hidden>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3H5a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h5M14 3h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5M9 17H5c-1.1 0-2-.9-2-2"/></svg>
          </button>
          <button class="btn btn-icon-only" id="reportPdfBtn" type="button" aria-label="Save as PDF" title="Save as PDF" hidden>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m0 0-4-4m4 4 4-4M5 21h14"/></svg>
          </button>
          <button class="btn btn-ai" id="reportBtn" type="button">
            <svg class="btn-icon" id="reportIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
            <span id="reportLabel">Generate Report</span>
            <span class="btn-ai-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
          </button>
        </div>
      </div>
      <div id="reportBody" class="report-body">
        <div class="report-empty">
          <div class="report-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></div>
          <p>Get an AI-written summary of this view's weekly data — highlights, risks, and a recommendation.</p>
        </div>
      </div>
    </section>

    <section class="panel" id="reminderPanel">
      <div class="panel-header">
        <h2>Reminders</h2>
      </div>
      <div class="reminder-row">
        <button class="btn btn-reminder reminder-eod" type="button" data-reminder="eod">
          <span class="reminder-icon-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
          <span class="reminder-text"><strong>EOD update</strong><small>Ask the team to log what got done today</small></span>
          <svg class="reminder-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
        <button class="btn btn-reminder reminder-plan" type="button" data-reminder="plan">
          <span class="reminder-icon-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3M16 3v3M4 9h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/></svg></span>
          <span class="reminder-text"><strong>Weekly plan</strong><small>Nudge them to set this week's plan</small></span>
          <svg class="reminder-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
        <button class="btn btn-reminder reminder-weekcheck" type="button" data-reminder="weekcheck">
          <span class="reminder-icon-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span>
          <span class="reminder-text"><strong>Week cross-check</strong><small>Review every task's status and notes</small></span>
          <svg class="reminder-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </section>
    </div>

    <section class="panel" id="teamPanel">
      <div class="panel-header">
        <h2>By team</h2>
      </div>
      <div id="teamTableWrap"></div>
    </section>

    <section class="panel" id="chartPanel">
      <div class="panel-header">
        <h2 id="chartTitle">Weekly breakdown</h2>
        <div class="panel-actions">
          <div class="seg-toggle" id="granularityToggle" aria-label="Chart granularity">
            <button type="button" class="seg-btn active" data-granularity="weekly">Weekly</button>
            <button type="button" class="seg-btn" data-granularity="daily">Daily</button>
          </div>
          <div class="legend" id="chartLegend"></div>
          <button class="link-btn" id="toggleTableBtn" type="button">View as table</button>
        </div>
      </div>
      <div id="chartWrap">
        <svg id="weeklyChart" role="img" aria-label="Weekly task counts by status"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
      <div id="weeklyTableWrap" hidden></div>
    </section>

    <footer class="page-footer" id="footer"></footer>
  </div>

  <div class="modal-overlay" id="reminderModalOverlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reminderModalTitle">
      <h3 id="reminderModalTitle">
        <svg class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.1-5.4A8.5 8.5 0 1 1 21 11.5Z"/></svg>
        <span id="reminderModalHeading">Send Reminder</span>
      </h3>
      <label class="modal-label" for="reminderNumber1">Receiver Number</label>
      <input class="text-input modal-input" id="reminderNumber1" type="tel" placeholder="+919999999999" />
      <label class="modal-label" for="reminderMessage">Message Preview</label>
      <textarea class="text-input modal-input modal-textarea" id="reminderMessage" rows="3"></textarea>
      <div class="modal-actions">
        <button class="btn" id="reminderCancelBtn" type="button">Cancel</button>
        <button class="btn btn-whatsapp" id="reminderSendBtn" type="button">Send via WhatsApp<span class="btn-ai-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
